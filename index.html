        // --- Utility Functions ---

        function formatTime(seconds) {
          if (seconds == null || isNaN(seconds)) return "0:00"
          const s = Math.max(0, Math.floor(seconds))
          const m = Math.floor(s / 60)
          const sec = s % 60
          return `${m}:${sec.toString().padStart(2, "0")}`
        }

        function readFileAsArrayBuffer(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader()
            reader.onload = () => resolve(reader.result)
            reader.onerror = () => reject(new Error("Failed to read file"))
            reader.readAsArrayBuffer(file)
          })
        }

        function readFileAsText(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader()
            reader.onload = () => resolve(reader.result)
            reader.onerror = () => reject(new Error("Failed to read file"))
            reader.readAsText(file)
          })
        }

        function arrayBufferToBase64(buffer) {
          const bytes = new Uint8Array(buffer)
          let binary = ""
          const chunkSize = 0x8000
          for (let i = 0; i < bytes.byteLength; i += chunkSize) {
            const chunk = bytes.subarray(i, i + chunkSize)
            binary += String.fromCharCode.apply(null, chunk)
          }
          return btoa(binary)
        }

        function debounce(func, wait) {
          let timeout
          return function executedFunction(...args) {
            const later = () => {
              clearTimeout(timeout)
              func(...args)
            }
            clearTimeout(timeout)
            timeout = setTimeout(later, wait)
          }
        }

        // --- DELAY MODIFICATION LOGIC ---
        function modifyHwlBuffer(originalBuffer, dA, dB) {
          const newBuffer = originalBuffer.slice(0)
          const view = new DataView(newBuffer)
          const totalFrames = (newBuffer.byteLength - 8) / 16

          const shiftA = Math.round(dA * 40)
          const shiftB = Math.round(dB * 40)

          const ampA = new Float32Array(totalFrames),
            ampB = new Float32Array(totalFrames)
          const freqA = new Float32Array(totalFrames),
            freqB = new Float32Array(totalFrames)

          for (let i = 0; i < totalFrames; i++) {
            const o = 8 + i * 16
            ampA[i] = view.getFloat32(o, true)
            ampB[i] = view.getFloat32(o + 4, true)
            freqA[i] = view.getFloat32(o + 8, true)
            freqB[i] = view.getFloat32(o + 12, true)
          }

          function shiftArray(arr, shift) {
            const res = new Float32Array(arr.length)
            if (shift > 0) {
              for (let i = shift; i < arr.length; i++) res[i] = arr[i - shift]
            } else if (shift < 0) {
              const abs = Math.abs(shift)
              for (let i = 0; i < arr.length - abs; i++) res[i] = arr[i + abs]
            } else {
              res.set(arr)
            }
            return res
          }

          const sAmpA = shiftArray(ampA, shiftA),
            sFreqA = shiftArray(freqA, shiftA)
          const sAmpB = shiftArray(ampB, shiftB),
            sFreqB = shiftArray(freqB, shiftB)

          for (let i = 0; i < totalFrames; i++) {
            const o = 8 + i * 16
            view.setFloat32(o, sAmpA[i], true)
            view.setFloat32(o + 4, sAmpB[i], true)
            view.setFloat32(o + 8, sFreqA[i], true)
            view.setFloat32(o + 12, sFreqB[i], true)
          }
          return newBuffer
        }

        function modifyFunscriptText(originalText, dA) {
          try {
            const data = JSON.parse(originalText)
            if (!data.actions || data.actions.length === 0) return originalText
            const shiftMs = dA * 1000
            const maxTime = data.actions[data.actions.length - 1].at
            let newActions = []

            for (let i = 0; i < data.actions.length; i++) {
              const pt = data.actions[i]
              let newAt = pt.at + shiftMs
              if (i === 0 && newAt < 0) newAt = 0
              if (i === data.actions.length - 1 && newAt > maxTime)
                newAt = maxTime
              if (newAt >= 0 && newAt <= maxTime)
                newActions.push({ pos: pt.pos, at: Math.round(newAt) })
            }

            let finalActions = []
            for (let i = 0; i < newActions.length; i++) {
              if (i === 0 || newActions[i].at !== newActions[i - 1].at)
                finalActions.push(newActions[i])
              else finalActions[finalActions.length - 1] = newActions[i]
            }
            data.actions = finalActions
            return JSON.stringify(data)
          } catch (e) {
            return originalText
          }
        }

        function setOriginalScript(bufferOrText, type) {
          originalScriptBuffer = bufferOrText
          currentScriptType = type
        }

        function clearOriginalScript() {
          originalScriptBuffer = null
          currentScriptType = null
        }

        function updateSliderFill(slider) {
          const val = parseFloat(slider.value)
          const min = parseFloat(slider.min)
          const max = parseFloat(slider.max)
          const percent = ((val - min) / (max - min)) * 100
          const center = 50

          let start = Math.min(percent, center)
          let end = Math.max(percent, center)

          const bg = `#1a1a1a`
          const fill = `#0078d4`
          slider.style.background = `linear-gradient(to right, ${bg} 0%, ${bg} ${start}%, ${fill} ${start}%, ${fill} ${end}%, ${bg} ${end}%, ${bg} 100%)`
        }

        function getModifiedScriptData() {
          if (!originalScriptBuffer || !currentScriptType) return null
          if (currentScriptType === "hwl") {
            return delayA === 0 && delayB === 0
              ? originalScriptBuffer
              : modifyHwlBuffer(originalScriptBuffer, delayA, delayB)
          } else if (currentScriptType === "funscript") {
            return delayA === 0
              ? originalScriptBuffer
              : modifyFunscriptText(originalScriptBuffer, delayA)
          }
          return originalScriptBuffer
        }

        async function applyDelayAndResend() {
          if (!originalScriptBuffer || !currentScriptType || !isConnected)
            return

          const currentTime = video.currentTime || state.player.position || 0
          const wasPlaying = state.player.playing
          const title = state.player.title || "script"

          const modifiedData = getModifiedScriptData()

          if (currentScriptType === "hwl") {
            await client.loadHwl(title, arrayBufferToBase64(modifiedData))
          } else if (currentScriptType === "funscript") {
            await client.loadFunscript(title, modifiedData)
          }

          await client.seek(currentTime)
          if (wasPlaying) {
            await client.startPlayer()
            if (video.paused && syncScriptCheck.checked)
              video.play().catch(() => {})
          }
          state = await client.getStatus()
          updateUI()
        }

        // --- UI Update Functions ---

        function updateUI() {
          const opts = state.options
          powerADisplay.innerText = opts.power_a + " / " + opts.power_a_limit
          powerBDisplay.innerText = opts.power_b + " / " + opts.power_b_limit

          btnMute.classList.toggle("primary", opts.mute)
          btnSwap.classList.toggle("primary", opts.swap_channels)
          btnAuto.classList.toggle("primary", opts.auto_increase_power)

          updateResyncBtnState()

          updatePlayerUI()
        }

        function isActivityTitle(title) {
          return title && /^Activity\s*\(/.test(title)
        }

        function updatePlayerUI() {
          const p = state.player

          const isPlaying = !!p.playing
          progressBar.classList.toggle("primary", isPlaying)
          stateBadge.classList.toggle("primary", isPlaying)
          stateBadge.textContent = isPlaying ? "Playing" : "Stopped"

          playStopBtn.textContent = isPlaying ? "⏹" : "▶"
          playStopBtn.setAttribute("aria-label", isPlaying ? "Stop" : "Play")
          playStopBtn.classList.toggle("stop", isPlaying)
          if (syncScriptCheck.checked) {
            playStopBtn.title = "Playback controlled by video"
          } else {
            playStopBtn.title = isConnected
              ? "Play/Pause script"
              : "Connect to enable playback"
          }

          if (p.title) {
            fileStatus.textContent = p.title
            fileStatus.classList.remove("empty")
          } else if (
            scriptBuffer &&
            typeof scriptBuffer === "object" &&
            scriptBuffer.name
          ) {
            fileStatus.textContent = `${scriptBuffer.name} [buffered]`
            fileStatus.classList.remove("empty")
          } else {
            fileStatus.textContent = "No script/activity loaded"
            fileStatus.classList.add("empty")
          }

          updatePlayerDisplay()
        }

        let toastTimeout
        function showToast(msg, type = "error") {
          const toast = document.getElementById("toast")
          if (!toast) return
          toast.textContent = msg
          toast.className = `toast ${type} show`
          clearTimeout(toastTimeout)
          toastTimeout = setTimeout(() => {
            toast.classList.remove("show")
          }, 4000)
        }

        function showError(msg) {
          errorDiv.innerText = msg
          errorDiv.style.display = "block"
          showToast(msg, "error")
        }

        function clearError() {
          errorDiv.innerText = ""
          errorDiv.style.display = "none"
        }

        function populateActivityDropdown(activities) {
          activitySelect.innerHTML = ""

          if (activities.length === 0) {
            const opt = document.createElement("option")
            opt.value = ""
            opt.textContent = "No activities available"
            activitySelect.appendChild(opt)
            activitySelect.disabled = true
            loadActivityBtn.disabled = true
            return
          }

          const defaultOpt = document.createElement("option")
          defaultOpt.value = ""
          defaultOpt.textContent = "Select activity..."
          activitySelect.appendChild(defaultOpt)

          for (const activity of activities) {
            const opt = document.createElement("option")
            opt.value = activity.name
            opt.textContent = activity.display_name
            activitySelect.appendChild(opt)
          }

          activitySelect.disabled = false
          loadActivityBtn.disabled = true
        }

        // --- Polling ---

        function startPolling() {
          stopPolling()

          const poll = async () => {
            try {
              const response = await client.getStatus()
              const timeSinceSeek = Date.now() - lastManualSeekTime
              if (
                timeSinceSeek < 200 &&
                response.player?.position !== undefined
              ) {
                state.options = { ...state.options, ...response.options }
                state.player.playing = response.player.playing
                state.player.title = response.player.title
                state.player.duration = response.player.duration
              } else {
                state = response
              }

              if (connectionState.status === "lost") {
                connectionState.status = "connected"
                updateConnectionUI("Connected", "var(--success)")
              }
              connectionState.lastSuccessfulPoll = Date.now()
              connectionState.reconnectAttempts = 0
              connectionState.reconnectDelay = 1000

              updateUI()

              if (
                activeQueue.length > 0 &&
                activeQueueIndex >= 0 &&
                isScriptComplete()
              ) {
                const now = Date.now()
                if (
                  !window._lastQueueAdvance ||
                  now - window._lastQueueAdvance > 2000
                ) {
                  window._lastQueueAdvance = now
                  advanceQueue()
                }
              }
            } catch (err) {
              console.error("Poll error:", err.message)

              if (err.isNetworkError) {
                handleDisconnect()
              }
            }

            if (connectionState.status === "connected") {
              pollInterval = setTimeout(poll, 1000)
            }
          }

          poll()
        }

        function stopPolling() {
          if (pollInterval !== null) {
            clearTimeout(pollInterval)
            pollInterval = null
          }
        }

        function handleDisconnect() {
          if (connectionState.status === "lost") return

          connectionState.status = "lost"
          updateConnectionUI("Connection lost", "var(--danger)")

          controlsDisable(true)

          attemptReconnect()
        }

        function attemptReconnect() {
          if (
            connectionState.reconnectAttempts >=
            connectionState.maxReconnectAttempts
          ) {
            updateConnectionUI("Reconnect failed", "var(--danger)")
            connectionState.isReconnecting = false
            return
          }

          connectionState.isReconnecting = true
          connectionState.reconnectAttempts++

          const delay = Math.min(
            connectionState.reconnectDelay *
              Math.pow(1.5, connectionState.reconnectAttempts - 1),
            30000,
          )

          setTimeout(async () => {
            try {
              await client.getStatus()
              connectionState.status = "connected"
              updateConnectionUI(
                `Connected to ${inputIp.value.trim()}`,
                "var(--success)",
              )
              controlsDisable(false)
              startPolling()
            } catch (err) {
              if (err.isNetworkError) {
                attemptReconnect()
              } else {
                updateConnectionUI("Server error", "var(--danger)")
                connectionState.isReconnecting = false
              }
            }
          }, delay)
        }

        function updateConnectionUI(text, color) {
          connStatus.textContent = text
          connStatus.style.color = color
        }

        function controlsDisable(t) {
          ;[btnAP, btnAM, btnBP, btnBM, btnMute, btnSwap, btnAuto].forEach(
            (btn) => {
              btn.disabled = t
            },
          )

          progressBar.disabled = t
          if (syncScriptCheck.checked) {
            playStopBtn.disabled = true
          } else {
            playStopBtn.disabled = t || !isConnected
          }

          activitySelect.disabled = t
          loadActivityBtn.disabled = t

          updateResyncBtnState()
        }
      })
    </script>
  </body>
</html>
